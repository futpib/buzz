name: buzz-edge

services:
  caddy:
    image: caddy:2.11-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:?set MCP_PUBLIC_HOST in .env}
      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP:?set VPS_PUBLIC_IP in .env}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://10.77.77.2:8080/_liveness && nc -z -w 3 10.77.77.2 5000",
        ]
      interval: 15s
      timeout: 5s
      retries: 4

volumes:
  caddy-data:
  caddy-config:
