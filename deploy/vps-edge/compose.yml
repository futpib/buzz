name: buzz-edge

services:
  caddy:
    image: caddy:2.11-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP:?set VPS_PUBLIC_IP in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://10.77.77.2:8080/_liveness",
        ]
      interval: 15s
      timeout: 5s
      retries: 4

  certbot:
    image: certbot/certbot:v5.7.0
    network_mode: host
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_started
    # Sharing Caddy's PID namespace lets the deploy hook perform a graceful,
    # zero-downtime certificate reload with SIGUSR1.
    pid: service:caddy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --quiet --deploy-hook 'kill -USR1 1'
          sleep 12h &
          wait $!
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  letsencrypt:
    external: true
    name: buzz-edge-letsencrypt
  certbot-www:
    external: true
    name: buzz-edge-certbot-www
  caddy-data:
  caddy-config:
