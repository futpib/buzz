name: buzz-edge

services:
  caddy:
    image: caddy:2.11-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP:?set VPS_PUBLIC_IP in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://10.77.77.2:8080/_liveness",
        ]
      interval: 15s
      timeout: 5s
      retries: 4

volumes:
  caddy-data:
  caddy-config:
