# Install as /etc/wireguard/wg-buzz.conf after replacing both CHANGE_ME values.
# The private key remains in a separate root-only file on this host.
[Interface]
Address = 10.77.77.2/24
PrivateKey = CHANGE_ME_LOCAL_WIREGUARD_PRIVATE_KEY

[Peer]
PublicKey = CHANGE_ME_VPS_WIREGUARD_PUBLIC_KEY
Endpoint = CHANGE_ME_VPS_PUBLIC_IP:51820
AllowedIPs = 10.77.77.1/32
PersistentKeepalive = 25
