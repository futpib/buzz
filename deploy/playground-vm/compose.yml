name: buzz-playground
services:
  postgres:
    image: postgres:17-alpine
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["/opt/buzz/data/postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: ["/opt/buzz/data/redis:/data"]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    network_mode: host
    command: server /data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY}
    volumes: ["/opt/buzz/data/minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  chat-web:
    image: node:22-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    user: "1100:1100"
    network_mode: host
    working_dir: /opt/buzz/code/buzz/chat-web
    command: ["node", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "4180"]
    environment:
      NODE_ENV: production
      BUZZ_RELAY_URL: http://127.0.0.1:3000
      BUZZ_PAIRING_RELAY_URL: wss://178.18.254.153:8443/pair
    volumes: ["/opt/buzz/code/buzz:/opt/buzz/code/buzz:ro"]
    restart: unless-stopped
